spring.application.name=SHARENTRENAMIENTO
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/ShareEntrenamiento}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

application.jwt.secret-key=
application.jwt.token-prefix=Bearer
application.jwt.token-expiration-days=1
application.jwt.refresh-token-expiration-days=7

# Configuración de Cloudinary
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


app.debug=true
logging.level.root=INFO
logging.level.com.sharentrenamiento.app=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Correo de servicio para el envío de recuperación y notificaciones.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp