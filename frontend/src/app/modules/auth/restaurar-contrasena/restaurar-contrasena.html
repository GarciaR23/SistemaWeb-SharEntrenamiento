<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Nueva Contraseña</h2>
      <p>Define tu nueva clave de acceso para<br>recuperar el control de tu cuenta.</p>
    </div>

    <form [formGroup]="restoreForm" class="auth-form" (ngSubmit)="onSubmit()" autocomplete="off">
      <label class="form-label">
        <span>Nueva contraseña</span>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••••••" />
          <button type="button" class="icon-button" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <img src="assets/icons/Icon_eye.png" alt="Ver contraseña" />
          </button>
        </div>
      </label>

      <label class="form-label">
        <span>Confirmar contraseña</span>
        <div class="input-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="••••••••••••" />
          <button type="button" class="icon-button" (click)="toggleConfirmPassword()" [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <img src="assets/icons/Icon_eye.png" alt="Ver contraseña" />
          </button>
        </div>
      </label>

      <button type="submit" [disabled]="restoreForm.invalid" class="btn-primary">
        Actualizar Contraseña
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </form>
  </div>
</div>
