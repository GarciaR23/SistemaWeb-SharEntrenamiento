<section class="perfil-page fade-in">
  <div class="perfil-shell">
    <nav class="perfil-steps" aria-label="Progreso de perfil">
      <button type="button" class="step" routerLink="/formulario" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>1</span>
        <small>PERFIL</small>
      </button>
      <div class="step-separator"></div>
      <button type="button" class="step" routerLink="/certificado" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>2</span>
        <small>CERTIFICADOS</small>
      </button>
      <div class="step-separator"></div>
      <button type="button" class="step" routerLink="/cuenta" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>3</span>
        <small>CUENTA</small>
      </button>
    </nav>

    <div class="perfil-card">
      <header class="perfil-header">
        <div>
          <h1>Perfil Profesional</h1>
          <p>Tu información como instructor certificado.</p>
        </div>
      </header>

      <form class="perfil-form" [formGroup]="profileForm" autocomplete="off">
        <div class="field-row">
          <label class="field-group">
            <span>Nombre Completo</span>
            <input type="text" placeholder="Ej. Alex Rivera" formControlName="fullName" />
          </label>

          <label class="field-group">
            <span>Especialidad</span>
            <select formControlName="specialty">
              <option value="">Selecciona tu área</option>
              <option value="Entrenamiento funcional">Entrenamiento funcional</option>
              <option value="Fitness general">Fitness general</option>
              <option value="Pilates">Pilates</option>
            </select>
          </label>
        </div>

        <div class="field-row">
          <label class="field-group">
            <span>Distrito</span>
            <select formControlName="district" (change)="onDistrictChange($event)">
              <option value="">Selecciona tu distrito</option>
              <option *ngFor="let d of allDistricts" [value]="d.code">{{ d.district | titlecase }}</option>
            </select>
          </label>

          <label class="field-group">
            <span>Dirección</span>
            <input type="text" placeholder="Ej. Av. Girasol" formControlName="address" />
          </label>
        </div>

        <div class="field-row">
          <label class="field-group">
            <span>Tarifa por hora (USD)</span>
            <input type="text" placeholder="$ 45.00" formControlName="rate" />
          </label>

          <div class="field-group">
            <span>Horario disponible</span>
            <div class="toggle-group">
              <button type="button" class="toggle" [class.active]="isShiftSelected('Mañana')" (click)="toggleShift('Mañana')">Mañana</button>
              <button type="button" class="toggle" [class.active]="isShiftSelected('Tarde')" (click)="toggleShift('Tarde')">Tarde</button>
              <button type="button" class="toggle" [class.active]="isShiftSelected('Noche')" (click)="toggleShift('Noche')">Noche</button>
            </div>
          </div>
        </div>

        <div class="section-label">DÍAS DISPONIBLES</div>
        <div class="days-grid">
          <button type="button" class="day" [class.active]="isDaySelected('L')" (click)="toggleDay('L')">L</button>
          <button type="button" class="day" [class.active]="isDaySelected('M')" (click)="toggleDay('M')">M</button>
          <button type="button" class="day" [class.active]="isDaySelected('Mi')" (click)="toggleDay('Mi')">Mi</button>
          <button type="button" class="day" [class.active]="isDaySelected('J')" (click)="toggleDay('J')">J</button>
          <button type="button" class="day" [class.active]="isDaySelected('V')" (click)="toggleDay('V')">V</button>
          <button type="button" class="day" [class.active]="isDaySelected('S')" (click)="toggleDay('S')">S</button>
          <button type="button" class="day" [class.active]="isDaySelected('D')" (click)="toggleDay('D')">D</button>
        </div>

        <div class="section-label">FRANJA HORARIA PREFERIDA</div>
        <div class="field-row preferred-time">
          <label class="time-pill">
            <span class="pill-label">Desde</span>
            <input
              type="time"
              formControlName="fromTime"
              (change)="onPreferredTimeChange()"
            />
          </label>

          <label class="time-pill">
            <span class="pill-label">Hasta</span>
            <input
              type="time"
              formControlName="toTime"
              (change)="onPreferredTimeChange()"
            />
          </label>
        </div>

        <label class="field-group bio-group">
          <span>Biografía profesional</span>
          <textarea rows="4" placeholder="Describe tu metodología, años de experiencia y lo que te motiva..." formControlName="bio"></textarea>
        </label>

        <!-- feedback will be shown in modal -->

        <div class="form-actions">
          <button type="button" class="btn-primary" (click)="goToCertificado()">Continuar →</button>
        </div>
      </form>
    </div>
  </div>
</section>

  <!-- Modal for reminders and feedback -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-body">
        <h2 *ngIf="!feedbackMessage">Aviso</h2>
        <p>{{ modalMessage || feedbackMessage }}</p>
        <button class="btn-primary" (click)="closeModal()">Ok</button>
      </div>
    </div>
  </div>
