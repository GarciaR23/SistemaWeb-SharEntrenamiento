<div class="workspace-layout" [class.mobile-sidebar-open]="isSidebarOpen">

    <app-sidebar [modo]="'admin'" [mobileOpen]="isSidebarOpen" [counts]="counts"></app-sidebar>
    <div class="sidebar-backdrop" *ngIf="isSidebarOpen" (click)="closeSidebarOnMobile()"></div>

    <div class="workspace-body">

        <app-panel-header modo="admin" (logoutClick)="logout()" (menuToggle)="toggleSidebar()"></app-panel-header>

        <main class="admin-workspace">
            <router-outlet></router-outlet>
        </main>

    </div>

</div>
