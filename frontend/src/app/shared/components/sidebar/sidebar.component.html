<aside class="sidebar" [class.open]="mobileOpen">

  <div class="sidebar-brand-header">
    <div class="logo-link">
      <div class="logo-icon">
        <img src="assets/icons/logo.png" alt="Shar Entrenamiento" class="logo-image">
      </div>
      <span class="logo-text">Shar<span class="logo-text-green">Entrenamiento</span></span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul>
      @for (item of currentMenu; track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active">
          <svg viewBox="0 0 24 24">
            <path [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      </li>
      }
    </ul>
  </nav>

</aside>
