<div class="dialog-backdrop" (click)="close()">
  <div class="dialog-shell" role="dialog" aria-modal="true" aria-labelledby="footer-dialog-title" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <div class="dialog-icon" aria-hidden="true">
        <span class="dialog-icon-symbol">{{ data?.icon }}</span>
      </div>

      <h2 id="footer-dialog-title" class="dialog-title">{{ data?.title }}</h2>
    </div>

    <p class="dialog-description">{{ data?.description }}</p>

    <button type="button" class="dialog-close-btn" (click)="close()">
      Cerrar
    </button>
  </div>
</div>
