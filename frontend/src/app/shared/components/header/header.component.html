<header class="header" [class.scrolled]="isScrolled">
  <nav class="navbar">
    <div class="navbar-container">

      <div class="navbar-logo">
        <a routerLink="/" class="logo-link">
          <div class="logo-icon">
            <span class="logo-circle blue-circle"></span>
            <span class="logo-circle green-circle"></span>
          </div>
          <span class="logo-text">
            Shar<span class="logo-text-green">Entrenamiento</span>
          </span>
        </a>
      </div>

      <div class="hamburger" (click)="toggleMenu()" [class.active]="isMenuOpen">
        <span></span><span></span><span></span>
      </div>

      <ul class="nav-menu" [class.active]="isMenuOpen">

        <ng-container *ngIf="modo === 'landing'">
          <li class="nav-item"><a routerLink="/metodologia" [fragment]="'metodologia'" routerLinkActive="active"
              class="nav-link" (click)="closeMenu()">Metodología</a></li>
          <li class="nav-item"><a routerLink="/testimonios" [fragment]="'testimonios'" routerLinkActive="active"
              class="nav-link" (click)="closeMenu()">Testimonios</a></li>
          <li class="nav-item"><a routerLink="/seguridad" [fragment]="'seguridad'" routerLinkActive="active"
              class="nav-link" (click)="closeMenu()">Seguridad</a></li>
          <li class="nav-item"><a routerLink="/soporte" [fragment]="'soporte'" routerLinkActive="active"
              class="nav-link" (click)="closeMenu()">Soporte</a></li>
        </ng-container>

        <ng-container *ngIf="modo === 'admin'">
          <li class="nav-item"><a routerLink="/admin/inicio" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Inicio</a></li>
          <li class="nav-item"><a routerLink="/admin/solicitud-instructor" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Solicitud</a></li>
          <li class="nav-item"><a routerLink="/admin/reporte-instructor" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Instructor</a></li>
          <li class="nav-item"><a routerLink="/admin/reporte-paciente" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Paciente</a></li>
        </ng-container>

        <ng-container *ngIf="modo === 'instructor'">
          <li class="nav-item"><a routerLink="/instructor/inicio" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Inicio</a></li>
          <li class="nav-item"><a routerLink="/instructor/sede" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Sedes</a></li>
          <li class="nav-item"><a routerLink="/instructor/bitacora" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Bitacora</a></li>
          <li class="nav-item"><a routerLink="/instructor/pago" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Pagos</a></li>
        </ng-container>


        <ng-container *ngIf="modo === 'tutor'">
          <li class="nav-item"><a routerLink="/tutor/inicio" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Inicio</a></li>
          <li class="nav-item"><a routerLink="/tutor/catalogo-instructor" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Instructor</a></li>
          <li class="nav-item"><a routerLink="/tutor/sesion" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Sesiones</a></li>
          <li class="nav-item"><a routerLink="/tutor/progreso" routerLinkActive="active" class="nav-link"
              (click)="closeMenu()">Progreso</a></li>
        </ng-container>
      </ul>

      <div class="nav-auth">
        <a *ngIf="modo === 'landing'" routerLink="/seleccion-rol" class="btn-cta" (click)="closeMenu()">
          Empezar Ahora
        </a>

          <a *ngIf="modo !== 'landing'" (click)="logoutClick.emit(); closeMenu()" class="btn-logout">
            Cerrar Sesión
          </a>
      </div>

    </div>
  </nav>
</header>
